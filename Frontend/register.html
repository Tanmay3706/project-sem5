<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StockDrive</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:floralwhite;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-box{
    width:900px;
    display:flex;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.left-panel{
    width:45%;
    background:lightseagreen;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.left-panel h1{
    font-size:34px;
    margin-bottom:15px;
}

.left-panel p{
    text-align:center;
    margin-bottom:25px;
}

.left-panel img{
    width:180px;
}

.right-panel{
    width:55%;
    padding:40px 50px;
}

.right-panel h2{
    margin-bottom:10px;
    font-size:30px;
}

.right-panel p{
    color:gray;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
    position:relative;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#1f4e79;
    box-shadow:0 0 8px rgba(31,78,121,.3);
}

#togglePassword{
    position:absolute;
    right:15px;
    top:45px;
    cursor:pointer;
}

button{
    width:100%;
    padding:14px;
    background:#1f4e79;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0b6e99;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:600;
}

.login-link{
    margin-top:20px;
    text-align:center;
}

.login-link a{
    text-decoration:none;
    color:#1f4e79;
    font-weight:600;
}

@media(max-width:900px){

.register-box{
    width:90%;
    flex-direction:column;
}

.left-panel,
.right-panel{
    width:100%;
}

}
</style>

</head>

<body>

<div class="container">

<div class="register-box">

<div class="left-panel">

<h1>StockDrive2</h1>

<p>Create your account to access the Management System </p>



</div>

<div class="right-panel">

<h2>Create Account</h2>

<p>Register as a new user</p>

<form id="registerForm">

<div class="input-group">
<label>Username</label>
<input type="text" id="username" placeholder="Enter Username">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="email" placeholder="Enter Email">
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter Phone Number">
</div>

<div class="input-group">
<label>Create Password</label>
<input type="password" id="password" placeholder="Create Password">
<span id="togglePassword">👁</span>
</div>

<button type="submit">Register</button>

<p id="message"></p>

<div class="login-link">
Already have an account?
<a href="Login.html">Login</a>
</div>

</form>

</div>

</div>

</div>

<script>

const form=document.getElementById("registerForm");
const password=document.getElementById("password");
const toggle=document.getElementById("togglePassword");
const message=document.getElementById("message");

toggle.onclick=function(){

if(password.type==="password"){
password.type="text";
toggle.innerHTML="🙈";
}
else{
password.type="password";
toggle.innerHTML="👁";
}

}

form.addEventListener("submit",function(e){

e.preventDefault();

let username=document.getElementById("username").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let pass=password.value.trim();

if(username==""||email==""||phone==""||pass==""){

message.style.color="red";
message.innerHTML="Please fill all the fields.";
return;

}

message.style.color="green";
message.innerHTML="Registration Successful! Redirecting to Login...";

localStorage.setItem("username", username);
setTimeout(function(){

window.location.href="Dashboard.html";

},1500);

});

</script>

</body>
</html>
