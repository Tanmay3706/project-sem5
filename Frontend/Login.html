    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Automobile ERP Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:floralwhite;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:900px;
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(42, 39, 70, 0.376);
}

.left-panel{
    width:45%;
    background: lightseagreen;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.left-panel h1{
    font-size:34px;
    margin-bottom:15px;
}

.left-panel p{
    text-align:center;
    margin-bottom:25px;
}


.right-panel{
    width:55%;
    padding:50px;
}

.right-panel h2{
    font-size:30px;
    margin-bottom:10px;
}

.right-panel p{
    margin-bottom:30px;
    color:gray;
}

.input-group{
    margin-bottom:20px;
    position:relative;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#1f4e79;
    box-shadow:0 0 10px rgba(31,78,121,.3);
}

#togglePassword{
    position:absolute;
    right:15px;
    top:45px;
    cursor:pointer;
    user-select:none;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:25px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#265887;
}

button{
    width:100%;
    padding:14px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0b6e99;
    transform:translateY(-2px);
}

#message{
    margin-top:20px;
    text-align:center;
    font-weight:600;
}

@media(max-width:900px){
    .login-box{
        flex-direction:column;
        width:90%;
    }

    .left-panel,
    .right-panel{
        width:100%;
    }
}
</style>

</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="left-panel">
            <h1>StockDrive</h1>
        </div>

        <div class="right-panel">

            <h2>Welcome </h2>
            <p>Login </p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter Username">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password">

                    <span id="togglePassword">👁</span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">
                    Login
                </button>

                 <div class="login-link">
                 <p style="text-align:center;margin-top:20px;">
                New User?
                 <a href="register.html" style="text-decoration:none;color:#1f4e79;font-weight:600;">
                 Sign Up
                 </a>
                 </p>
                </div>

                <p id="message"></p>

            </form>

        </div>

    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const username = document.getElementById("username");
const password = document.getElementById("password");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

    if(password.type === "password"){
        password.type = "text";
        togglePassword.innerHTML = "🙈";
    }else{
        password.type = "password";
        togglePassword.innerHTML = "👁";
    }

});

form.addEventListener("submit", function(e){

    e.preventDefault();
    message.innerHTML = "";

    if(username.value.trim() === ""){
        message.style.color = "red";
        message.innerHTML = "Username cannot be empty";
        username.focus();
        return;
    }

    if(password.value.trim() === ""){
        message.style.color = "red";
        message.innerHTML = "Password cannot be empty";
        password.focus();
        return;
    }

    if(username.value === "admin" && password.value === "admin123"){

        message.style.color = "green";
        message.innerHTML = "Login Successful";

         localStorage.setItem("username", username.value);

        setTimeout(()=>{
            window.location.href = "dashboard.html";
        },1000);

    }else{

        message.style.color = "red";
        message.innerHTML = "Invalid Username or Password";

    }

});
</script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
        alert("Please enter username and password.");
        return;
    }

    const loginData = {
        username: username,
        password: password
    };

    try {

        const response = await fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(loginData)
        });

        const result = await response.json();

        if (response.ok) {

            alert("Login successful!");

            sessionStorage.setItem("userId", result.userId);
            sessionStorage.setItem("username", result.username);
            sessionStorage.setItem("role", result.role);

            window.location.href = "Dashboard.html";

        } else {

            alert(result);

        }

    } catch (error) {

        console.error("Login error:", error);

        alert("Unable to connect to StockDrive server.");
    }
});
</script>
</body>
</html>
